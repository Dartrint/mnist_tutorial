name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          python -m pip install ruff
          ruff check mnist tests

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

      - name: Download MNIST and run a smoke-training run
        run: |
          python -m mnist.data
          python -m mnist.train --limit 2000 --epochs 1 --val-size 500 \
            --hidden 64 --batch-size 128 --out /tmp/smoke.npz --quiet
          python -m mnist.evaluate --model /tmp/smoke.npz --limit 1000

      - name: Smoke-test the demo script
        run: python examples/demo.py --limit 1000 --epochs 1 --out /tmp/demo.npz --grid /tmp/demo.png
