[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-toolkit"
version = "0.1.0"
description = "Dependency-light MNIST digit classification: NumPy MLP + optional PyTorch CNN"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
mnist-train = "mnist.train:main"
mnist-evaluate = "mnist.evaluate:main"
mnist-predict = "mnist.predict:main"
mnist-cnn = "mnist.torch_cnn:main"
mnist-serve = "mnist.webapp:main"

[tool.setuptools]
packages = ["mnist"]

[tool.setuptools.package-data]
mnist = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
